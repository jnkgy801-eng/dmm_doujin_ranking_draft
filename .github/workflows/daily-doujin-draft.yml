name: DMM同人ランキング下書き生成

# ⚠️ このワークフローはX（Twitter）への自動"公開"は一切行いません。
#    生成された下書きは Artifact としてアップロードされます。
#    BUFFER_API_KEY / BUFFER_CHANNEL_IDS を secrets に設定した場合、
#    下書きは Buffer に「下書き（draft・未公開・承認待ち）」として自動送信されますが、
#    実際にXへ公開する最終操作は必ず Buffer 管理画面で人間が行ってください。
#    （即時公開に切り替えるオプションはこのワークフローには存在しません）

on:
  schedule:
    # 毎日 08:00 JST (=UTC 23:00 前日) に実行。時間を変えたい場合はここを編集してください。
    - cron: '0 23 * * *'
  workflow_dispatch: {}  # 手動実行もできるようにしておく

permissions:
  contents: write  # 重複除外用の履歴ファイルをコミットし直すために必要

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install requests

      - name: 出力先ディレクトリを作成
        run: mkdir -p outputs

      - name: 下書き生成スクリプトを実行
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          OUTPUT_DIR: ${{ github.workspace }}/outputs
          # 必要に応じて調整してください
          RANK_COUNT: '5'
          FETCH_HITS: '30'
          HISTORY_KEEP_DAYS: '30'
          # --- Buffer連携（任意。両方設定した場合のみ下書きをBufferに自動送信）---
          # 送信は常に saveToDraft=true（下書き・未公開）として行われ、
          # 即時公開に切り替える設定項目はありません。
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: |
          python dmm_doujin_ranking_draft.py | tee outputs/draft_$(date +%Y-%m-%d).txt

      - name: 下書きをArtifactとしてアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doujin-draft-${{ github.run_id }}
          path: outputs/draft_*.txt
          retention-days: 14
          if-no-files-found: warn

      - name: 重複判定用の履歴ファイルをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f outputs/dmm_doujin_ranking_history.json ]; then
            git add outputs/dmm_doujin_ranking_history.json
            git diff --cached --quiet || git commit -m "chore: 同人ランキング投稿履歴を更新"
            git push
          else
            echo "履歴ファイルが存在しないためコミットをスキップします（スクリプトがエラー終了した可能性があります）"
          fi
